<script>
/* 云同步：端到端加密、私人链接、自动合并、同步状态 */
(function () {
  const V = window.V;
  const CFG_KEY = 'ielts_sync_v1';
  const SUPA_KEY = 'ielts_supabase_v1';
  const AAD = 'ielts-vocab-sync-v1';

  const SCHEMA_SQL = `create table if not exists public.sync_states (
  id text primary key,
  payload text not null,
  updated_at timestamptz not null default now()
);

alter table public.sync_states enable row level security;

drop policy if exists "sync_read" on public.sync_states;
create policy "sync_read" on public.sync_states for select using (true);

drop policy if exists "sync_insert" on public.sync_states;
create policy "sync_insert" on public.sync_states for insert with check (true);

drop policy if exists "sync_update" on public.sync_states;
create policy "sync_update" on public.sync_states for update using (true);`;

  const enc = new TextEncoder();
  const dec = new TextDecoder();

  function nowIso() { return new Date().toISOString(); }

  function b64url(bytes) {
    let bin = '';
    const arr = bytes instanceof Uint8Array ? bytes : new Uint8Array(bytes);
    for (let i = 0; i < arr.length; i++) bin += String.fromCharCode(arr[i]);
    return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }

  function fromB64url(s) {
    const text = String(s || '').replace(/-/g, '+').replace(/_/g, '/');
    const pad = text.length % 4 ? '='.repeat(4 - (text.length % 4)) : '';
    const bin = atob(text + pad);
    const out = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }

  function randomKey() {
    const b = new Uint8Array(32);
    crypto.getRandomValues(b);
    return b64url(b);
  }

  function newSpaceId() {
    return crypto.randomUUID();
  }

  function validKey(s) {
    try { return fromB64url(s).length === 32; } catch (e) { return false; }
  }

  async function keyObject(key) {
    return crypto.subtle.importKey('raw', fromB64url(key), { name: 'AES-GCM' }, false, ['encrypt', 'decrypt']);
  }

  async function encryptDoc(doc, key) {
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const cipher = await crypto.subtle.encrypt(
      { name: 'AES-GCM', iv, additionalData: enc.encode(AAD) },
      await keyObject(key),
      enc.encode(JSON.stringify(doc))
    );
    return JSON.stringify({ v: 1, alg: 'A256GCM', iv: b64url(iv), c: b64url(new Uint8Array(cipher)) });
  }

  async function decryptDoc(text, key) {
    let box;
    try { box = JSON.parse(text); } catch (e) { throw new Error('云端数据格式不正确'); }
    if (!box || box.v !== 1 || !box.iv || !box.c) throw new Error('云端数据格式不正确');
    let plain;
    try {
      plain = await crypto.subtle.decrypt(
        { name: 'AES-GCM', iv: fromB64url(box.iv), additionalData: enc.encode(AAD) },
        await keyObject(key),
        fromB64url(box.c)
      );
    } catch (e) {
      throw new Error('无法解密云端数据：私人链接里的密钥可能不完整');
    }
    let doc;
    try { doc = JSON.parse(dec.decode(plain)); } catch (e) { throw new Error('云端数据已损坏'); }
    if (!doc || !Array.isArray(doc.words)) throw new Error('云端数据格式不正确');
    return doc;
  }

  /* ---------------- 稳定序列化 / 合并 ---------------- */

  function stable(v) {
    if (v === null || typeof v !== 'object') return JSON.stringify(v);
    if (Array.isArray(v)) return '[' + v.map(stable).join(',') + ']';
    return '{' + Object.keys(v).sort().map(k => JSON.stringify(k) + ':' + stable(v[k])).join(',') + '}';
  }

  function laterDate(a, b) {
    if (!a) return b || null;
    if (!b) return a;
    return String(a) >= String(b) ? a : b;
  }

  function mergeWrong(a, b) {
    a = a || {}; b = b || {};
    return {
      count: Math.max(Number(a.count || 0), Number(b.count || 0)),
      last: laterDate(a.last, b.last)
    };
  }

  function mergeDay(target, src) {
    if (!src) return;
    for (const k of ['answers', 'correct', 'ms', 'new', 'reviews']) {
      target[k] = Math.max(Number(target[k] || 0), Number(src[k] || 0));
    }
  }

  function copyWord(w) {
    return V.normalizeWord(JSON.parse(JSON.stringify(w)));
  }

  // 把云端文档合并进本地。返回是否有任何变化。
  function mergeRemote(remote) {
    const before = stable(V.buildSyncDoc());
    const remoteWords = (remote.words || []).map(copyWord);
    const remoteTombs = Array.isArray(remote.tombstones) ? remote.tombstones : [];

    const byId = new Map(V.state.words.map(w => [w.id, w]));
    const tombs = V.state.tombstones || (V.state.tombstones = {});

    for (const t of remoteTombs) {
      if (!t || !t.id || !t.updatedAt) continue;
      const old = tombs[t.id];
      if (!old || String(t.updatedAt) > String(old.updatedAt)) {
        tombs[t.id] = {
          id: t.id,
          word: String(t.word || ''),
          deletedAt: t.deletedAt || t.updatedAt,
          updatedAt: t.updatedAt
        };
      }
    }

    for (const rw of remoteWords) {
      if (!rw.id) continue;
      const lw = byId.get(rw.id);
      const tomb = tombs[rw.id];

      // 删除标记更新：不能把旧设备里的词传回来
      if (tomb && String(tomb.updatedAt) >= String(rw.updatedAt)) {
        if (lw && String(tomb.updatedAt) > String(lw.updatedAt)) {
          byId.delete(rw.id);
        }
        continue;
      }
      if (tomb) delete tombs[rw.id];

      if (!lw) {
        byId.set(rw.id, rw);
        continue;
      }

      if (String(rw.updatedAt) > String(lw.updatedAt)) {
        const wrong = mergeWrong(rw.wrong, lw.wrong);
        const createdAt = lw.createdAt && lw.createdAt < rw.createdAt ? lw.createdAt : rw.createdAt;
        for (const k of Object.keys(lw)) {
          if (!(k in rw)) delete lw[k];
        }
        Object.assign(lw, rw, { wrong, createdAt });
      } else {
        lw.wrong = mergeWrong(lw.wrong, rw.wrong);
      }
    }

    // 本地有、云端有删除标记：删除旧的本地词
    const localIds = new Set(byId.keys());
    for (const id of localIds) {
      const lw = byId.get(id);
      const tomb = tombs[id];
      if (!tomb) continue;
      if (String(tomb.updatedAt) > String(lw.updatedAt)) byId.delete(id);
      else delete tombs[id];
    }

    // 删除标记不能压过更新的词
    for (const id of Object.keys(tombs)) {
      const w = byId.get(id);
      if (w && String(w.updatedAt) > String(tombs[id].updatedAt)) delete tombs[id];
    }

    V.state.words = Array.from(byId.values());

    // 统计：清空标记取较新；各设备、各日期分别取较大值，读取时再相加
    const rs = remote.stats || {};
    const localStats = V.state.stats;
    const lc = Date.parse(localStats.clearedAt || 0) || 0;
    const rc = Date.parse(rs.clearedAt || 0) || 0;
    if (rc > lc) {
      localStats.devices = {};
      localStats.clearedAt = rs.clearedAt;
    } else if (!localStats.clearedAt && rs.clearedAt) {
      localStats.clearedAt = rs.clearedAt;
    }
    if (rc >= lc) {
      const devices = localStats.devices || (localStats.devices = {});
      const remoteDevices = rs.devices || {};
      for (const deviceId of Object.keys(remoteDevices)) {
        const dev = devices[deviceId] || (devices[deviceId] = {});
        const rdev = remoteDevices[deviceId] || {};
        for (const date of Object.keys(rdev)) {
          const day = dev[date] || (dev[date] = {});
          mergeDay(day, rdev[date]);
        }
      }
    }

    const after = stable(V.buildSyncDoc());
    if (before !== after) {
      V._applyingRemote = true;
      try { V.save(true); } finally { V._applyingRemote = false; }
    }
    return before !== after;
  }

  /* ---------------- 本地配置 ---------------- */

  function loadCfg() {
    try {
      const c = JSON.parse(localStorage.getItem(CFG_KEY) || 'null');
      if (!c || !c.spaceId || !validKey(c.key)) return null;
      return c;
    } catch (e) { return null; }
  }

  let cfg = loadCfg();
  let status = cfg ? 'idle' : 'off';
  let errorText = '';
  let retryCount = 0;
  let retryTimer = null;
  let debounceTimer = null;
  let active = null;
  let pending = false;
  let lastAttempt = 0;
  let lastChanged = false;

  /* Supabase 项目配置（URL + anon key，可公开） */
  function loadSupa() {
    try {
      const s = JSON.parse(localStorage.getItem(SUPA_KEY) || 'null');
      if (!s || !/^https:\/\//i.test(s.url || '') || !s.anonKey) return null;
      return { url: String(s.url).replace(/\/+$/, ''), anonKey: String(s.anonKey) };
    } catch (e) { return null; }
  }

  function saveSupa() {
    try {
      if (supa) localStorage.setItem(SUPA_KEY, JSON.stringify(supa));
      else localStorage.removeItem(SUPA_KEY);
    } catch (e) { /* ignore */ }
  }

  let supa = loadSupa();

  function hasSupa() {
    return !!(supa && /^https:\/\//i.test(supa.url) && supa.anonKey && supa.anonKey.length > 40);
  }

  function saveCfg() {
    try {
      if (cfg) localStorage.setItem(CFG_KEY, JSON.stringify(cfg));
      else localStorage.removeItem(CFG_KEY);
    } catch (e) {
      if (V.toast) V.toast('无法保存同步链接：浏览器存储不可用', 'error');
    }
  }

  function buildLink() {
    if (!cfg) return '';
    const base = location.origin + location.pathname;
    let link = base + '#sync=' + encodeURIComponent(cfg.spaceId) + '&key=' + encodeURIComponent(cfg.key);
    if (hasSupa()) {
      link += '&u=' + encodeURIComponent(supa.url) + '&k=' + encodeURIComponent(supa.anonKey);
    }
    return link;
  }

  function setStatus(s, detail) {
    status = s;
    if (detail != null) errorText = detail;
    V.refreshCloudUI();
  }

  function statusKind() {
    if (!hasSupa() || !cfg) return 'off';
    if (status === 'syncing' || status === 'connecting') return 'syncing';
    if (status === 'error') return 'error';
    return 'ok';
  }

  function ago(iso) {
    if (!iso) return '';
    const ms = Date.now() - Date.parse(iso);
    if (!isFinite(ms) || ms < 0) return '刚刚';
    if (ms < 20000) return '刚刚';
    if (ms < 60000) return Math.max(1, Math.round(ms / 1000)) + ' 秒前';
    if (ms < 3600000) return Math.round(ms / 60000) + ' 分钟前';
    if (ms < 86400000) return Math.round(ms / 3600000) + ' 小时前';
    return Math.round(ms / 86400000) + ' 天前';
  }

  function statusText() {
    if (!hasSupa()) return '未配置 Supabase';
    if (!cfg) return '未开启云同步';
    if (status === 'syncing') return '同步中…';
    if (status === 'connecting') return '正在连接…';
    if (status === 'error') return '同步失败，重试中';
    if (!cfg.lastSyncAt) return '等待首次同步';
    return '已同步 · ' + ago(cfg.lastSyncAt);
  }

  /* ---------------- Supabase API ---------------- */

  function apiBase() {
    return supa.url.replace(/\/+$/, '') + '/rest/v1/sync_states';
  }

  function apiHeaders(extra) {
    return Object.assign({
      apikey: supa.anonKey,
      authorization: 'Bearer ' + supa.anonKey,
      accept: 'application/json'
    }, extra || {});
  }

  async function requestJson(url, opts) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 15000);
    try {
      const res = await fetch(url, Object.assign({}, opts || {}, { signal: ctrl.signal, cache: 'no-store' }));
      const text = await res.text();
      let data = null;
      try { data = text ? JSON.parse(text) : null; } catch (e) { data = null; }

      if (!res.ok) {
        const msg = data && (data.message || data.error) ? (data.message || data.error) : ('HTTP ' + res.status);
        if (res.status === 401 || res.status === 403) throw new Error('Supabase anon key 不正确或没有权限');
        if (res.status === 404 || (data && data.code === '42P01')) {
          throw new Error('Supabase 里还没有 sync_states 表，请先执行 supabase/schema.sql');
        }
        throw new Error('Supabase 请求失败：' + msg);
      }
      return data;
    } catch (e) {
      if (e && e.name === 'AbortError') throw new Error('连接 Supabase 超时，请检查网络');
      throw e;
    } finally {
      clearTimeout(timer);
    }
  }

  async function fetchRemote() {
    const url = apiBase() + '?id=eq.' + encodeURIComponent(cfg.spaceId) + '&select=payload,updated_at';
    const rows = await requestJson(url, { headers: apiHeaders() });
    if (!Array.isArray(rows) || !rows.length) return null;
    const row = rows[0];
    if (!row || typeof row.payload !== 'string') throw new Error('云端数据格式不正确');
    return row;
  }

  async function putRemote(encrypted) {
    const url = apiBase() + '?on_conflict=id';
    const body = JSON.stringify([{ id: cfg.spaceId, payload: encrypted, updated_at: nowIso() }]);
    return requestJson(url, {
      method: 'POST',
      headers: apiHeaders({
        'content-type': 'application/json',
        prefer: 'resolution=merge-duplicates,return=minimal'
      }),
      body
    });
  }

  /* ---------------- 同步主流程 ---------------- */

  async function performSync() {
    if (!cfg || !hasSupa()) return false;
    lastAttempt = Date.now();
    setStatus('syncing');

    let changed = false;
    const remote = await fetchRemote();
    let remoteDoc = null;
    if (remote) remoteDoc = await decryptDoc(remote.payload, cfg.key);

    if (remoteDoc && mergeRemote(remoteDoc)) changed = true;

    const merged = V.buildSyncDoc();
    if (!remoteDoc || stable(merged) !== stable(remoteDoc)) {
      await putRemote(await encryptDoc(merged, cfg.key));
      changed = true;
    }

    cfg.lastSyncAt = nowIso();
    saveCfg();
    retryCount = 0;
    setStatus('idle');
    return changed;
  }

  function afterSync(changed) {
    lastChanged = changed;
    if (changed && !V.session && !document.querySelector('.modal-backdrop')) {
      V.render();
    } else {
      V.refreshCloudUI();
    }
  }

  function scheduleRetry() {
    if (retryTimer) clearTimeout(retryTimer);
    const delay = Math.min(60000, 5000 * Math.pow(2, Math.min(retryCount, 4)));
    retryCount++;
    retryTimer = setTimeout(() => {
      retryTimer = null;
      if (cfg && document.visibilityState !== 'hidden') syncNow('retry');
    }, delay);
  }

  function syncNow(reason) {
    if (!cfg) return Promise.resolve(false);
    if (active) {
      pending = true;
      return active;
    }
    clearTimeout(debounceTimer);
    active = performSync()
      .then(changed => {
        afterSync(changed);
        return changed;
      })
      .catch(e => {
        const msg = e && e.message ? e.message : '同步失败';
        setStatus('error', msg);
        if (V.toast && reason === 'manual') V.toast(msg, 'error');
        scheduleRetry();
        return false;
      })
      .finally(() => {
        active = null;
        if (pending) {
          pending = false;
          setTimeout(() => syncNow('pending'), 300);
        }
      });
    return active;
  }

  function onLocalChange() {
    if (!cfg || V._applyingRemote) return;
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(() => syncNow('local'), 1500);
  }

  /* ---------------- 设置界面动作 ---------------- */

  function closeModal() { if (V.closeModal) V.closeModal(); }

  function showLink(extraError) {
    const link = buildLink();
    const err = extraError || (status === 'error' ? errorText : '');
    V.openModal(
      '<div class="modal-head"><div><h3>云同步已开启</h3><p>这条私人链接就是钥匙，两台设备打开同一个网址即可</p></div>' +
      '<button class="icon-btn" data-action="close-modal">' + V.icon('x') + '</button></div>' +
      '<div class="modal-body">' +
      '<div class="sync-key-box">' +
      '<label>私人同步链接</label>' +
      '<input id="sync-link-input" readonly value="' + V.esc(link) + '">' +
      '<button class="btn btn-primary" data-action="cloud-copy">' + V.icon('copy', 16) + '复制链接</button>' +
      '</div>' +
      (err ? '<div class="quiz-feedback no" style="margin-top:12px">' + V.icon('alert', 16) + '<div>' + V.esc(err) + '</div></div>' : '') +
      '<div class="sync-hint-list">' +
      '<div><b>1</b><span>把链接发给自己（微信文件传输助手 / 备忘录 / AirDrop），在 iPhone 上打开一次。</span></div>' +
      '<div><b>2</b><span>之后两台设备打开网站就会自动同步，不用再点。</span></div>' +
      '<div><b>3</b><span>链接丢了等于丢钥匙。可以在设置里重置，会新建一份云端空间。</span></div>' +
      '</div>' +
      '<div class="sync-secret">' + V.icon('lock', 15) + '<span>云端只保存加密后的数据，密钥只存在于这条链接里。不要把链接发到公开地方。</span></div>' +
      '</div>' +
      '<div class="modal-foot"><div class="spacer"></div>' +
      '<button class="btn" data-action="cloud-sync">' + V.icon('refresh', 15) + '立即同步</button>' +
      '<button class="btn btn-primary" data-action="close-modal">我已保存</button></div>'
    );
  }

  async function startCloud() {
    if (cfg) { showLink(); return; }
    if (!hasSupa()) { openConfig(); return; }
    if (!window.isSecureContext || !crypto.subtle) {
      V.toast('云同步需要 HTTPS 网站（localhost 也可以）', 'error');
      return;
    }
    V.openModal(
      '<div class="modal-head"><div><h3>正在创建云空间…</h3><p>不会注册账号，也不会收集个人信息</p></div></div>' +
      '<div class="modal-body"><div class="sync-loading"><span class="spinner"></span><p>正在生成随机密钥并加密你的词库</p></div></div>'
    );
    setStatus('connecting');
    try {
      cfg = {
        spaceId: newSpaceId(),
        key: randomKey(),
        lastSyncAt: null,
        createdAt: nowIso()
      };
      saveCfg();
      setStatus('idle');
      retryCount = 0;
      await syncNow('create');
      showLink();
    } catch (e) {
      cfg = null;
      saveCfg();
      setStatus('off');
      const msg = e && e.message ? e.message : '创建云空间失败';
      V.openModal(
        '<div class="modal-head"><div><h3>云同步没有开启</h3><p>' + V.esc(msg) + '</p></div>' +
        '<button class="icon-btn" data-action="close-modal">' + V.icon('x') + '</button></div>' +
        '<div class="modal-body"><div class="quiz-feedback no">' + V.icon('alert', 16) + '<div>请确认：<br>1. Supabase 里已执行 <b>supabase/schema.sql</b> 建表<br>2. Project URL 和 anon key 填对了<br>3. 当前网络能访问 supabase.co</div></div></div>' +
        '<div class="modal-foot"><button class="btn" data-action="cloud-config">修改配置</button><button class="btn btn-primary" data-action="close-modal">知道了</button></div>'
      );
    }
  }

  function openConfig() {
    const s = supa || {};
    V.openModal(
      '<div class="modal-head"><div><h3>配置 Supabase</h3><p>同步数据存在你自己的 Supabase 项目里</p></div>' +
      '<button class="icon-btn" data-action="close-modal">' + V.icon('x') + '</button></div>' +
      '<div class="modal-body">' +
      '<div class="field"><label>Project URL</label><input id="supabase-url" placeholder="https://xxxx.supabase.co" value="' + V.esc(s.url || '') + '"></div>' +
      '<div class="field"><label>anon public key</label><textarea id="supabase-key" placeholder="eyJhbGciOi...">' + V.esc(s.anonKey || '') + '</textarea></div>' +
      '<details class="sql-details"><summary>查看建表 SQL（复制到 Supabase SQL Editor 执行）</summary>' +
      '<textarea id="supabase-sql" readonly>' + V.esc(SCHEMA_SQL) + '</textarea>' +
      '<button class="btn btn-sm" data-action="cloud-copy-sql">' + V.icon('copy', 14) + '复制 SQL</button></details>' +
      '<div class="quiz-feedback ok" style="margin-top:4px">' + V.icon('info', 16) +
      '<div>在 Supabase 的 SQL Editor 里执行上面的 SQL 建表，再把 Project Settings → API 里的两个值填到这里。anon key 可以公开。</div></div>' +
      '</div>' +
      '<div class="modal-foot"><button class="btn" data-action="close-modal">取消</button>' +
      '<button class="btn btn-primary" data-action="cloud-save-config">保存配置</button></div>'
    );
  }

  function saveConfig() {
    const urlEl = document.getElementById('supabase-url');
    const keyEl = document.getElementById('supabase-key');
    if (!urlEl || !keyEl) return;
    const url = urlEl.value.trim().replace(/\/+$/, '');
    const anonKey = keyEl.value.trim();
    if (!/^https:\/\/.+/i.test(url)) {
      V.toast('请填写完整的 Project URL（https://...）', 'error');
      return;
    }
    if (anonKey.length < 40) {
      V.toast('anon key 看起来不完整，请重新复制', 'error');
      return;
    }
    supa = { url, anonKey };
    saveSupa();
    V.closeModal();
    V.render();
    V.toast('Supabase 配置已保存', 'success');
  }

  async function copyLink() {
    const link = buildLink();
    if (!link) { V.toast('还没有云同步链接', 'error'); return; }
    let ok = false;
    try {
      await navigator.clipboard.writeText(link);
      ok = true;
    } catch (e) {
      try {
        const ta = document.createElement('textarea');
        ta.value = link;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        ok = document.execCommand('copy');
        ta.remove();
      } catch (e2) { ok = false; }
    }
    V.toast(ok ? '链接已复制' : '复制失败，请长按输入框手动复制', ok ? 'success' : 'error');
  }

  async function copySql() {
    let ok = false;
    try {
      await navigator.clipboard.writeText(SCHEMA_SQL);
      ok = true;
    } catch (e) {
      try {
        const ta = document.getElementById('supabase-sql');
        if (ta) {
          ta.focus();
          ta.select();
          ok = document.execCommand('copy');
        }
      } catch (e2) { ok = false; }
    }
    V.toast(ok ? '建表 SQL 已复制' : '复制失败，请手动全选复制', ok ? 'success' : 'error');
  }

  async function manualSync() {
    if (!hasSupa()) { openConfig(); return; }
    if (!cfg) { startCloud(); return; }
    V.toast('正在同步…', 'info');
    await syncNow('manual');
    if (status === 'idle') {
      V.toast('已同步 · ' + ago(cfg.lastSyncAt), 'success');
    } else if (status === 'error') {
      V.toast(errorText || '同步失败', 'error');
    }
  }

  function disconnect() {
    V.confirm({
      title: '断开云同步？',
      desc: '只会停止这台设备的自动同步，本地词库和学习记录都保留。云端数据不会被删除；重新打开私人链接即可再次连接。',
      confirmText: '断开',
      danger: true,
      onConfirm: () => {
        cfg = null;
        saveCfg();
        setStatus('off');
        V.refreshCloudUI();
        if (V.ui.route === 'settings') V.render();
        V.toast('已断开云同步', 'success');
      }
    });
  }

  function resetSpace() {
    V.confirm({
      title: '重置云同步？',
      desc: '会新建一份云端空间和一条新链接，当前词库与进度会重新加密上传。旧链接仍然指向旧数据，但不会再自动更新，也无法找回新密钥。',
      confirmText: '新建云空间',
      danger: true,
      onConfirm: () => {
        cfg = null;
        saveCfg();
        setStatus('off');
        startCloud();
      }
    });
  }

  function parseHash() {
    const raw = String(location.hash || '').replace(/^#/, '');
    if (!raw) return null;
    let params;
    try { params = new URLSearchParams(raw); } catch (e) { return null; }

    const u = params.get('u');
    const k = params.get('k');
    if (u && k && /^https:\/\//i.test(u) && k.length > 40) {
      supa = { url: u.replace(/\/+$/, ''), anonKey: k };
      saveSupa();
    }

    const spaceId = params.get('sync');
    const key = params.get('key');
    if (!spaceId || !key) return null;
    if (!/^[a-f0-9-]{36}$/i.test(spaceId) || !validKey(key)) return null;
    return { spaceId, key };
  }

  function stripHash() {
    try {
      history.replaceState(null, '', location.pathname + location.search);
    } catch (e) { /* file:// */ }
  }

  /* ---------------- 初始化 ---------------- */

  function bind() {
    setInterval(() => {
      if (cfg && document.visibilityState !== 'hidden') syncNow('timer');
    }, 30000);

    document.addEventListener('visibilitychange', () => {
      if (!cfg || document.visibilityState !== 'visible') return;
      if (Date.now() - lastAttempt > 6000) syncNow('visible');
    });

    window.addEventListener('online', () => {
      if (cfg) syncNow('online');
    });

    V.onLocalChange = onLocalChange;
  }

  V.refreshCloudUI = function () {
    const kind = statusKind();
    const text = statusText();
    document.querySelectorAll('[data-cloud-text]').forEach(el => { el.textContent = text; });
    document.querySelectorAll('[data-cloud-dot]').forEach(el => {
      el.setAttribute('data-state', kind);
    });
    document.querySelectorAll('[data-cloud-link]').forEach(el => {
      el.disabled = !cfg;
    });
  };

  V.cloud = {
    linked: () => !!cfg,
    configured: hasSupa,
    link: buildLink,
    statusText,
    statusKind,
    lastSyncAt: () => cfg && cfg.lastSyncAt,
    error: () => errorText,
    syncNow,
    openSetup: startCloud,
    openConfig,
    saveConfig,
    copySql,
    showLink,
    copyLink,
    manualSync,
    disconnect,
    resetSpace,
    init: function () {
      const incoming = parseHash();
      if (incoming) {
        cfg = {
          spaceId: incoming.spaceId,
          key: incoming.key,
          lastSyncAt: null,
          createdAt: nowIso()
        };
        saveCfg();
        stripHash();
        setStatus('idle');
        if (V.toast) V.toast('已连接私人云同步，正在合并数据…', 'success');
        setTimeout(() => syncNow('link'), 120);
      } else if (cfg && hasSupa()) {
        setTimeout(() => syncNow('startup'), 700);
      }
      bind();
      V.refreshCloudUI();
    }
  };
  V.cloud._test = {
    encryptDoc,
    decryptDoc,
    mergeRemote,
    stable,
    randomKey,
    parseHash
  };
})();

</script>
<script>
/* 学习会话：记忆卡片 / 选择题 / 乱序速刷 */
(function () {
  const V = window.V;
  const esc = s => V.esc(s);

  V.session = null;

  const MODE_LABEL = { flip: '记忆卡片', quiz: '选择题', rush: '乱序速刷' };

  /* ---------------- 发音 ---------------- */

  V.speak = function (text) {
    if (!text) return;
    if (!('speechSynthesis' in window)) {
      V.toast('当前浏览器不支持语音朗读，换 Chrome / Edge 试试', 'error');
      return;
    }
    try {
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(String(text));
      u.lang = V.state.settings.accent || 'en-US';
      u.rate = Number(V.state.settings.rate) || 0.95;
      window.speechSynthesis.speak(u);
    } catch (e) { /* 忽略 */ }
  };

  const autoSpeak = w => {
    if (V.state.settings.autoSpeak && w) setTimeout(() => V.speak(w.word), 180);
  };

  /* ---------------- 组队 ---------------- */

  function buildQueue(mode, opts) {
    opts = opts || {};
    const all = V.state.words;
    if (opts.ids && opts.ids.length) {
      return opts.ids.filter(id => V.findWord(id));
    }
    if (mode === 'rush') {
      return V.shuffle(all.map(w => w.id)).slice(0, opts.limit || 100);
    }

    const t = V.today();
    const due = all
      .filter(w => w.stats.seen > 0 && w.srs.due <= t)
      .sort((a, b) => String(a.srs.due).localeCompare(String(b.srs.due)))
      .map(w => w.id)
      .slice(0, V.state.settings.reviewLimit);

    const fresh = all.filter(w => w.stats.seen === 0).map(w => w.id);
    const day = V.dayStats(t);
    const remain = Math.max(0, V.state.settings.dailyNew - (day.new || 0));
    const extra = opts.extraNew || 0;

    return due.concat(fresh.slice(0, remain + extra));
  }

  /* ---------------- 开始 / 结束 ---------------- */

  V.startSession = function (mode, opts) {
    opts = opts || {};
    if (V.session) return;

    let ids = buildQueue(mode, opts);
    if (mode === 'quiz') {
      ids = ids.filter(id => {
        const w = V.findWord(id);
        return w && w.meaning && w.meaning.trim();
      });
    }

    if (!ids.length) {
      V.toast(mode === 'quiz' ? '还没有带释义的单词，先去词库补充吧' : '今天没有要学的词，休息一下或去词库加点新词', 'info');
      return;
    }

    V.session = {
      mode,
      ids,
      idx: 0,
      phase: 'front',
      quiz: null,
      answered: 0,
      correct: 0,
      finished: false,
      startedAt: Date.now(),
      shownAt: performance.now(),
      source: opts.source || 'plan'
    };

    document.getElementById('modal-root').innerHTML = '';
    document.body.classList.add('modal-open');
    V.renderSession();
    const w = V.findWord(ids[0]);
    autoSpeak(w);
  };

  V.endSession = function (silent) {
    V.session = null;
    const root = document.getElementById('session-root');
    if (root) root.innerHTML = '';
    document.body.classList.remove('modal-open');
    if (!silent) {
      V.save();
      V.render();
    }
  };

  V.exitSession = function () {
    if (!V.session) return;
    V.endSession(false);
  };

  /* ---------------- 渲染 ---------------- */

  function highlight(text, word) {
    if (!text) return '';
    const safe = String(word).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    const re = new RegExp('(' + safe + '[a-z]*)', 'ig');
    return esc(text).replace(re, '<mark>$1</mark>');
  }

  function topicChip(w) {
    return w.topic ? '<span class="topic-chip">' + esc(w.topic) + '</span>' : '';
  }

  function detailRows(w) {
    const rows = [];
    if (w.roots) rows.push(['词根', w.roots]);
    if (w.syn && w.syn.length) rows.push(['同义', w.syn.join(' · ')]);
    if (w.ant && w.ant.length) rows.push(['反义', w.ant.join(' · ')]);
    if (w.col && w.col.length) rows.push(['搭配', w.col.join(' · ')]);
    if (!rows.length) return '';
    return '<dl class="fc-details">' + rows.map(([k, v]) =>
      '<dt>' + k + '</dt><dd>' + esc(v) + '</dd>'
    ).join('') + '</dl>';
  }

  function frontCard(w) {
    return '<div class="flashcard" data-action="flip" title="点击翻转">' +
      '<div class="fc-meta">' + topicChip(w) +
      '<span class="spacer"></span>' +
      '<span class="fc-hint"><span class="kbd">空格</span> 翻转</span></div>' +
      '<div class="fc-main">' +
      '<div class="fc-word">' + esc(w.word) + '</div>' +
      '<div class="fc-phon">' + (w.phonetic ? esc(w.phonetic) : '') +
      '<button class="icon-btn sm" data-action="speak" data-word="' + esc(w.word) + '" title="发音">' + V.icon('volume', 16) + '</button></div>' +
      '<div class="fc-hint-line">点击卡片，或按空格查看释义</div>' +
      '</div></div>';
  }

  function backCard(w, mode) {
    return '<div class="flashcard static">' +
      '<div class="fc-meta">' + topicChip(w) +
      '<span class="spacer"></span>' +
      '<span class="fc-hint">' + (mode === 'rush' ? '速刷 · 不计入复习计划' : '按 1 / 2 / 3 评价') + '</span></div>' +
      '<div class="fc-main">' +
      '<div class="fc-word small">' + esc(w.word) +
      '<button class="icon-btn sm" data-action="speak" data-word="' + esc(w.word) + '" title="发音" style="vertical-align:middle;margin-left:6px">' + V.icon('volume', 16) + '</button></div>' +
      '<div class="fc-phon">' + (w.phonetic ? esc(w.phonetic) : '') + '</div>' +
      '<div class="fc-meaning">' + esc(w.meaning || '（暂无释义）') + '</div>' +
      (w.pos ? '<div class="fc-pos">' + esc(w.pos) + '</div>' : '') +
      (w.example ? '<div class="fc-example">' + highlight(w.example, w.word) + '</div>' : '') +
      (w.exampleZh ? '<div class="fc-example-zh">' + esc(w.exampleZh) + '</div>' : '') +
      detailRows(w) +
      (w.note ? '<div class="fc-note"><b>我的笔记</b><br>' + esc(w.note) + '</div>' : '') +
      '</div>' +
      '<div class="row" style="margin-top:14px;justify-content:flex-end">' +
      '<button class="btn btn-sm" data-action="session-note">' + V.icon('edit', 13) + (w.note ? '改笔记' : '记一笔') + '</button>' +
      '</div></div>';
  }

  function ratingFooter(w, mode) {
    if (mode === 'rush') {
      return '<div class="rating-row" style="grid-template-columns:repeat(2,1fr)">' +
        '<button class="rate-btn again" data-action="rate" data-q="1">不认识<small>收入错词本</small></button>' +
        '<button class="rate-btn good" data-action="rate" data-q="5">认识<small>继续下一个</small></button>' +
        '</div><div class="session-tip">速刷只记录对错，不影响间隔重复计划</div>';
    }
    const q1 = V.gradeLabel(V.previewInterval(w, 1));
    const q3 = V.gradeLabel(V.previewInterval(w, 3));
    const q5 = V.gradeLabel(V.previewInterval(w, 5));
    return '<div class="rating-row">' +
      '<button class="rate-btn again" data-action="rate" data-q="1">忘记<small>' + q1 + '</small></button>' +
      '<button class="rate-btn hard" data-action="rate" data-q="3">模糊<small>' + q3 + '</small></button>' +
      '<button class="rate-btn good" data-action="rate" data-q="5">记住<small>' + q5 + '</small></button>' +
      '</div><div class="session-tip">按 1 / 2 / 3 快速评价</div>';
  }

  function quizCard(w) {
    const s = V.session;
    const q = s.quiz;
    const answered = q.answered;
    const options = q.options.map((opt, i) => {
      let cls = 'option';
      if (answered) {
        if (opt === w.meaning) cls += ' correct';
        else if (i === q.chosen) cls += ' wrong';
        else cls += ' dimmed';
      }
      return '<button class="' + cls + '" data-action="quiz-answer" data-i="' + i + '"' + (answered ? ' disabled' : '') + '>' +
        '<span class="keycap">' + (i + 1) + '</span><span>' + esc(opt) + '</span></button>';
    }).join('');

    const feedback = answered
      ? (q.correct
        ? '<div class="quiz-feedback ok">' + V.icon('check', 16) + '<div><b>回答正确</b> · ' + esc(w.meaning) + '</div></div>'
        : '<div class="quiz-feedback no">' + V.icon('x', 16) + '<div><b>正确答案：' + esc(w.meaning) + '</b>' +
          (w.example ? '<br><span style="opacity:.8">' + esc(w.example) + '</span>' : '') + '</div></div>')
      : '';

    return '<div class="quiz">' +
      '<div class="quiz-head"><div class="quiz-word">' + esc(w.word) + '</div>' +
      '<div class="quiz-sub">' + (w.phonetic ? esc(w.phonetic) : '') +
      '<button class="icon-btn sm" data-action="speak" data-word="' + esc(w.word) + '" title="发音">' + V.icon('volume', 16) + '</button>' +
      '</div></div>' +
      '<div class="options">' + options + '</div>' + feedback + '</div>';
  }

  function topBar(s) {
    const pct = Math.round(s.idx / Math.max(1, s.ids.length) * 100);
    return '<header class="session-top">' +
      '<button class="icon-btn" data-action="exit-session" title="退出（Esc）">' + V.icon('back') + '</button>' +
      '<div class="session-progress"><i style="width:' + pct + '%"></i></div>' +
      '<span class="session-badge">' + MODE_LABEL[s.mode] + '</span>' +
      '<div class="session-count">' + Math.min(s.idx + 1, s.ids.length) + ' / ' + s.ids.length + '</div>' +
      '</header>';
  }

  V.renderSession = function () {
    const s = V.session;
    const root = document.getElementById('session-root');
    if (!root) return;

    if (!s) { root.innerHTML = ''; return; }

    if (s.finished) {
      const acc = s.answered ? Math.round(s.correct / s.answered * 100) : 0;
      const mins = Math.max(1, Math.round((Date.now() - s.startedAt) / 60000));
      root.innerHTML = '<div class="session"><div class="session-body"><div class="summary">' +
        '<div class="summary-emoji">🎉</div>' +
        '<h2>这一轮完成啦</h2>' +
        '<p>' + MODE_LABEL[s.mode] + ' · 共 ' + s.answered + ' 个词</p>' +
        '<div class="summary-stats">' +
        '<div class="summary-stat"><b>' + s.answered + '</b><span>学习词数</span></div>' +
        '<div class="summary-stat"><b>' + acc + '%</b><span>正确率</span></div>' +
        '<div class="summary-stat"><b>' + mins + '</b><span>用时（分钟）</span></div>' +
        '</div>' +
        '<div class="summary-actions">' +
        '<button class="btn btn-primary btn-lg" data-action="start" data-mode="flip">再学一轮</button>' +
        '<button class="btn btn-lg" data-action="start" data-mode="rush">乱序速刷</button>' +
        '<button class="btn btn-lg" data-action="home">回到首页</button>' +
        '</div></div></div></div>';
      return;
    }

    const w = V.findWord(s.ids[s.idx]);
    if (!w) { s.idx++; V.renderSession(); return; }

    if (s.mode === 'quiz' && !s.quiz) {
      s.quiz = makeQuiz(w);
    }

    let body, foot;
    if (s.mode === 'quiz') {
      body = '<div class="session-body">' + quizCard(w) + '</div>';
      if (s.quiz.answered) {
        foot = '<footer class="session-foot">' +
          (s.quiz.correct
            ? '<div class="session-tip">回答正确，正在进入下一个…</div>'
            : '<button class="btn btn-primary reveal-btn" data-action="session-continue">继续（空格）</button>') +
          '</footer>';
      } else {
        foot = '<footer class="session-foot"><div class="session-tip">点击选项作答，也可以按 1 – 4</div></footer>';
      }
    } else {
      body = '<div class="session-body">' + (s.phase === 'front' ? frontCard(w) : backCard(w, s.mode)) + '</div>';
      if (s.phase === 'front') {
        foot = '<footer class="session-foot"><button class="btn btn-primary reveal-btn" data-action="flip">显示释义（空格）</button></footer>';
      } else {
        foot = '<footer class="session-foot">' + ratingFooter(w, s.mode) + '</footer>';
      }
    }

    root.innerHTML = '<div class="session">' + topBar(s) + body + foot + '</div>';
  };

  function makeQuiz(w) {
    const pool = V.shuffle(V.state.words.filter(x =>
      x.id !== w.id && x.meaning && x.meaning.trim() && x.meaning !== w.meaning
    ));
    const options = [w.meaning];
    for (const x of pool) {
      if (!options.includes(x.meaning)) options.push(x.meaning);
      if (options.length >= 4) break;
    }
    return {
      options: V.shuffle(options),
      answered: false,
      chosen: -1,
      correct: false
    };
  }

  /* ---------------- 交互 ---------------- */

  V.flip = function () {
    const s = V.session;
    if (!s || s.finished || s.mode === 'quiz') return;
    if (s.phase === 'front') {
      s.phase = 'back';
      s.shownAt = performance.now();
      V.renderSession();
    }
  };

  function advance() {
    const s = V.session;
    if (!s) return;
    s.idx += 1;
    s.phase = 'front';
    s.quiz = null;
    s.shownAt = performance.now();

    if (s.idx >= s.ids.length) {
      s.finished = true;
      V.renderSession();
      V.save();
      return;
    }
    V.renderSession();
    autoSpeak(V.findWord(s.ids[s.idx]));
  }

  V.rate = function (q) {
    const s = V.session;
    if (!s || s.finished || s.phase !== 'back' || s.mode === 'quiz') return;

    const w = V.findWord(s.ids[s.idx]);
    if (!w) return advance();

    const ms = performance.now() - s.shownAt;
    const correct = q >= 3;
    V.recordAnswer(w, correct, ms, s.mode === 'rush' ? 'rush' : 'flip', q);
    s.answered += 1;
    if (correct) s.correct += 1;

    V.save();
    advance();
  };

  V.quizAnswer = function (i) {
    const s = V.session;
    if (!s || s.mode !== 'quiz' || !s.quiz || s.quiz.answered) return;
    const w = V.findWord(s.ids[s.idx]);
    if (!w) return advance();

    const chosen = s.quiz.options[i];
    if (chosen === undefined) return;

    const correct = chosen === w.meaning;
    const ms = performance.now() - s.shownAt;

    s.quiz.answered = true;
    s.quiz.chosen = i;
    s.quiz.correct = correct;

    V.recordAnswer(w, correct, ms, 'quiz');
    s.answered += 1;
    if (correct) s.correct += 1;
    V.save();
    V.renderSession();

    if (correct) setTimeout(() => { if (V.session === s) advance(); }, 900);
  };

  V.sessionContinue = function () {
    const s = V.session;
    if (!s || !s.quiz || !s.quiz.answered) return;
    advance();
  };

  V.editSessionNote = function () {
    const s = V.session;
    if (!s) return;
    const w = V.findWord(s.ids[s.idx]);
    if (!w) return;
    V.openModal(
      '<div class="modal-head"><div><h3>' + esc(w.word) + ' · 我的笔记</h3><p>写点只对你有用的助记</p></div>' +
      '<button class="icon-btn" data-action="close-modal">' + V.icon('x') + '</button></div>' +
      '<div class="modal-body"><div class="field"><textarea id="note-input" placeholder="比如：ubi = everywhere，看到 -ous 就知道是形容词…">' + esc(w.note) + '</textarea></div></div>' +
      '<div class="modal-foot"><button class="btn" data-action="close-modal">取消</button>' +
      '<button class="btn btn-primary" data-action="save-session-note" data-id="' + w.id + '">保存</button></div>'
    );
  };
})();

</script>
<script>
/* 导入向导、单词表单、备份恢复 */
(function () {
  const V = window.V;
  const esc = s => V.esc(s);

  const FIELDS = [
    { key: 'word', label: '单词', req: true, aliases: ['单词', '词汇', '英文单词', '英文', '词', 'word', 'english', 'term', 'vocab', 'vocabulary'] },
    { key: 'phonetic', label: '音标', aliases: ['音标', '发音', 'phonetic', 'pronunciation', 'ipa'] },
    { key: 'pos', label: '词性', aliases: ['词性', 'pos', 'part of speech'] },
    { key: 'meaning', label: '中文释义', aliases: ['中文释义', '释义', '中文', '意思', '词义', '翻译', 'meaning', 'definition', 'chinese'] },
    { key: 'example', label: '英文例句', aliases: ['英文例句', '例句', 'example', 'sentence'] },
    { key: 'exampleZh', label: '例句翻译', aliases: ['例句翻译', '例句中文', '译文', '例句译文', 'example translation'] },
    { key: 'roots', label: '词根词缀', aliases: ['词根词缀', '词根', '词缀', 'roots', 'root', 'etymology'] },
    { key: 'syn', label: '同义词', aliases: ['同义词', '近义词', 'synonym', 'synonyms'] },
    { key: 'ant', label: '反义词', aliases: ['反义词', 'antonym', 'antonyms'] },
    { key: 'col', label: '常见搭配', aliases: ['常见搭配', '搭配', '词组', 'collocation', 'collocations'] },
    { key: 'topic', label: '话题分类', aliases: ['话题分类', '话题', '分类', '标签', '类别', 'topic', 'category', 'tag'] },
    { key: 'note', label: '笔记 / 助记', aliases: ['记忆提示', '笔记', '备注', '助记', '记忆', '提示', 'note', 'notes', 'memo'] }
  ];

  let wz = null; // 导入向导状态

  const norm = s => String(s || '').toLowerCase().replace(/[\s\-_/\\（）()【】\[\]:：.。,，、]/g, '');

  function matchHeader(text) {
    const h = norm(text);
    if (!h) return null;
    let best = null, bestScore = 0;
    for (const f of FIELDS) {
      for (const a of f.aliases) {
        const na = norm(a);
        if (!na) continue;
        let score = 0;
        if (h === na) score = 100 + na.length;
        else if (h.includes(na)) score = na.length;
        if (score > bestScore) { bestScore = score; best = f.key; }
      }
    }
    return bestScore >= 2 ? best : null;
  }

  const colLetter = i => {
    let s = '';
    i += 1;
    while (i > 0) {
      const m = (i - 1) % 26;
      s = String.fromCharCode(65 + m) + s;
      i = Math.floor((i - 1) / 26);
    }
    return s;
  };

  /* ---------------- 第一步：选文件 ---------------- */

  V.openImport = function () {
    wz = null;
    V.openModal(
      '<div class="modal-head"><div><h3>导入词表</h3><p>支持 Excel（.xlsx）和 CSV，自动识别表头</p></div>' +
      '<button class="icon-btn" data-action="close-modal">' + V.icon('x') + '</button></div>' +
      '<div class="modal-body">' +
      '<div class="dropzone" id="dropzone">' + V.icon('upload', 26) +
      '<b>点击选择文件，或把表格拖进来</b>' +
      '<span>.xlsx / .csv，第一行建议是表头</span>' +
      '<small>列名可用：单词、音标、词性、释义、例句、例句翻译、词根、同义词、反义词、搭配、话题、笔记</small>' +
      '</div>' +
      '<input type="file" id="import-file" accept=".xlsx,.csv,.txt" class="hidden">' +
      '<p class="hint" style="margin-top:14px">同一个单词重复出现时，默认跳过已有词条；下一步可以改成覆盖或全部保留。</p>' +
      '</div>'
    );
    bindStep1();
  };

  function bindStep1() {
    const dz = document.getElementById('dropzone');
    const input = document.getElementById('import-file');
    if (!dz || !input) return;

    dz.addEventListener('click', () => input.click());
    input.addEventListener('change', () => {
      if (input.files && input.files[0]) handleFile(input.files[0]);
    });

    ['dragenter', 'dragover'].forEach(ev => dz.addEventListener(ev, e => {
      e.preventDefault();
      dz.classList.add('drag');
    }));
    ['dragleave', 'drop'].forEach(ev => dz.addEventListener(ev, e => {
      e.preventDefault();
      dz.classList.remove('drag');
    }));
    dz.addEventListener('drop', e => {
      const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
      if (f) handleFile(f);
    });
  }

  async function handleFile(file) {
    const dz = document.getElementById('dropzone');
    if (dz) dz.innerHTML = '<b>正在读取 ' + esc(file.name) + ' …</b><span>大文件可能需要几秒</span>';
    try {
      const rows = await V.parseSpreadsheet(file);
      if (!rows || !rows.length) throw new Error('表格里没有读到内容');
      wz = buildWizard(file.name, rows);
      renderStep2();
    } catch (err) {
      V.toast(err && err.message ? err.message : '读取失败，请检查文件', 'error');
      V.openImport();
    }
  }

  function buildWizard(fileName, rows) {
    const maxCols = Math.max.apply(null, rows.slice(0, 40).map(r => r.length).concat([1]));

    // 找表头：前 8 行里匹配字段最多的一行
    let headerRow = -1, bestScore = 1;
    for (let r = 0; r < Math.min(8, rows.length); r++) {
      let score = 0;
      for (let c = 0; c < rows[r].length; c++) if (matchHeader(rows[r][c])) score++;
      if (score > bestScore) { bestScore = score; headerRow = r; }
    }

    const mapping = {};
    FIELDS.forEach(f => { mapping[f.key] = -1; });

    if (headerRow >= 0) {
      for (let c = 0; c < maxCols; c++) {
        const key = matchHeader(rows[headerRow][c] || '');
        if (key && mapping[key] === -1) mapping[key] = c;
      }
    } else {
      mapping.word = 0;
    }

    return {
      fileName,
      rows,
      headerRow,
      maxCols,
      mapping,
      dataStart: headerRow >= 0 ? headerRow + 1 : 0,
      sampleOnly: isSampleOnly()
    };
  }

  // 词库里是不是还只有内置示例词（且一个都没学）
  function isSampleOnly() {
    const names = new Set((V.SAMPLE_WORDS || []).map(s => s.word.toLowerCase()));
    const words = V.state.words;
    if (!words.length) return false;
    return words.every(w => names.has(w.word.toLowerCase()) && w.stats.seen === 0);
  }

  /* ---------------- 第二步：映射 + 预览 ---------------- */

  function columnLabel(c) {
    const head = wz.headerRow >= 0 ? String(wz.rows[wz.headerRow][c] || '').trim() : '';
    return head ? colLetter(c) + ' · ' + head : '第 ' + (c + 1) + ' 列';
  }

  function renderStep2() {
    const cols = [];
    for (let c = 0; c < wz.maxCols; c++) cols.push({ idx: c, label: columnLabel(c) });

    const selects = FIELDS.map(f =>
      '<div class="field"><label>' + f.label + (f.req ? ' <span class="req" style="color:#e11d48">*</span>' : '') + '</label>' +
      '<select data-map="' + f.key + '"><option value="-1">— 不导入 —</option>' +
      cols.map(c => '<option value="' + c.idx + '"' + (wz.mapping[f.key] === c.idx ? ' selected' : '') + '>' + esc(c.label) + '</option>').join('') +
      '</select></div>'
    ).join('');

    const warn = wz.headerRow < 0
      ? '<div class="quiz-feedback no" style="margin-bottom:12px">' + V.icon('info', 16) + '<div>没找到明显的表头，已默认第 1 列是单词。请手动确认下面每一列对应的字段。</div></div>'
      : '';

    V.openModal(
      '<div class="modal-head"><div><h3>确认导入</h3><p>把表格的每一列对应到单词卡片字段</p></div>' +
      '<button class="icon-btn" data-action="close-modal">' + V.icon('x') + '</button></div>' +
      '<div class="modal-body">' +
      '<div class="file-pill">' + V.icon('file', 17) + '<b>' + esc(wz.fileName) + '</b><span>' + wz.rows.length + ' 行</span></div>' +
      warn +
      '<div class="step-title"><span class="n">1</span>列对应关系</div>' +
      '<div class="map-grid">' + selects + '</div>' +
      '<div class="step-title"><span class="n">2</span>预览（前 5 行）</div>' +
      '<div class="preview-wrap" id="preview-wrap"></div>' +
      '<div class="step-title"><span class="n">3</span>遇到重复单词</div>' +
      '<div class="radio-row">' +
      '<label class="radio-pill"><input type="radio" name="dup-mode" value="skip" checked>跳过已有</label>' +
      '<label class="radio-pill"><input type="radio" name="dup-mode" value="overwrite">覆盖释义</label>' +
      '<label class="radio-pill"><input type="radio" name="dup-mode" value="append">全部保留</label>' +
      '</div>' +
      (wz.sampleOnly
        ? '<div style="margin-top:10px"><label class="radio-pill"><input type="checkbox" id="clear-first" checked>先清空内置的示例词，只保留我的词表</label></div>'
        : '') +
      '</div>' +
      '<div class="modal-foot">' +
      '<button class="btn" data-action="import-again">' + V.icon('back', 15) + '换个文件</button>' +
      '<div class="spacer"></div>' +
      '<button class="btn" data-action="close-modal">取消</button>' +
      '<button class="btn btn-primary" data-action="do-import" id="do-import">导入</button>' +
      '</div>',
      { wide: true, focus: false }
    );

    const wrap = document.getElementById('modal-root');
    wrap.querySelectorAll('[data-map]').forEach(sel => {
      sel.addEventListener('change', () => {
        wz.mapping[sel.dataset.map] = Number(sel.value);
        renderPreview();
      });
    });

    renderPreview();
  }

  function renderPreview() {
    const wrap = document.getElementById('preview-wrap');
    if (!wrap || !wz) return;

    const active = FIELDS.filter(f => wz.mapping[f.key] >= 0);
    const rows = [];
    for (let i = wz.dataStart; i < wz.rows.length && rows.length < 5; i++) {
      const row = wz.rows[i];
      const word = wz.mapping.word >= 0 ? String(row[wz.mapping.word] || '').trim() : '';
      if (!word) continue;
      rows.push(row);
    }

    if (!active.length || !rows.length) {
      wrap.innerHTML = '<div style="padding:18px;text-align:center;color:#7b8798;font-size:12.5px">' +
        (!active.length ? '还没有选择任何列' : '没有预览到数据，检查一下「单词」列选对了吗') + '</div>';
    } else {
      const head = active.map(f => '<th>' + esc(f.label) + '</th>').join('');
      const body = rows.map(row => '<tr>' + active.map(f => {
        const v = String(row[wz.mapping[f.key]] || '');
        return '<td>' + esc(v.length > 42 ? v.slice(0, 42) + '…' : v) + '</td>';
      }).join('') + '</tr>').join('');
      wrap.innerHTML = '<table class="data"><thead><tr>' + head + '</tr></thead><tbody>' + body + '</tbody></table>';
    }

    const btn = document.getElementById('do-import');
    if (btn) {
      const ok = wz.mapping.word >= 0;
      btn.disabled = !ok;
      btn.textContent = ok ? '导入表格' : '请先选择「单词」列';
    }
  }

  /* ---------------- 执行导入 ---------------- */

  V.doImport = function () {
    if (!wz) return;
    const map = wz.mapping;
    if (map.word < 0) { V.toast('请先指定「单词」列', 'error'); return; }

    const modeEl = document.querySelector('input[name="dup-mode"]:checked');
    const mode = modeEl ? modeEl.value : 'skip';

    const clearEl = document.getElementById('clear-first');
    if (clearEl && clearEl.checked) V.removeAllWords();

    const existing = new Map(V.state.words.map(w => [w.word.toLowerCase(), w]));
    const seen = new Set();
    let added = 0, updated = 0, skipped = 0;

    const val = (row, key) => {
      const c = map[key];
      if (c < 0) return '';
      const v = row[c];
      return v == null ? '' : String(v).trim();
    };

    for (let i = wz.dataStart; i < wz.rows.length; i++) {
      const row = wz.rows[i];
      const raw = val(row, 'word');
      if (!raw) { continue; }
      if (raw.length > 80) { skipped++; continue; }
      const word = raw.replace(/\s+/g, ' ');
      const key = word.toLowerCase();

      if (seen.has(key) && mode !== 'append') { skipped++; continue; }
      seen.add(key);

      const rec = {
        word,
        phonetic: val(row, 'phonetic'),
        pos: val(row, 'pos'),
        meaning: val(row, 'meaning'),
        example: val(row, 'example'),
        exampleZh: val(row, 'exampleZh'),
        roots: val(row, 'roots'),
        syn: V.splitList(val(row, 'syn')),
        ant: V.splitList(val(row, 'ant')),
        col: V.splitList(val(row, 'col')),
        topic: val(row, 'topic'),
        note: val(row, 'note')
      };

      const dup = existing.get(key);
      if (dup) {
        if (mode === 'skip') { skipped++; continue; }
        if (mode === 'overwrite') {
          const keep = (nv, ov) => (nv && nv.length ? nv : ov);
          dup.phonetic = keep(rec.phonetic, dup.phonetic);
          dup.pos = keep(rec.pos, dup.pos);
          dup.meaning = keep(rec.meaning, dup.meaning);
          dup.example = keep(rec.example, dup.example);
          dup.exampleZh = keep(rec.exampleZh, dup.exampleZh);
          dup.roots = keep(rec.roots, dup.roots);
          dup.topic = keep(rec.topic, dup.topic);
          if (rec.syn.length) dup.syn = rec.syn;
          if (rec.ant.length) dup.ant = rec.ant;
          if (rec.col.length) dup.col = rec.col;
          V.touchWord(dup);
          updated++;
          continue;
        }
      }

      const w = V.normalizeWord(rec);
      V.state.words.push(w);
      existing.set(key, w);
      added++;
    }

    V.save(true);
    V.closeModal();
    wz = null;
    V.render();
    V.toast('导入完成：新增 ' + added + ' 个，更新 ' + updated + ' 个，跳过 ' + skipped + ' 个', 'success');
  };

  /* ---------------- 单词表单 ---------------- */

  V.saveWordForm = function (id) {
    const form = document.getElementById('word-form');
    if (!form) return;
    if (!form.reportValidity()) return;

    const fd = new FormData(form);
    const get = k => String(fd.get(k) || '').trim();

    const data = {
      word: get('word'),
      phonetic: get('phonetic'),
      pos: get('pos'),
      meaning: get('meaning'),
      example: get('example'),
      exampleZh: get('exampleZh'),
      roots: get('roots'),
      syn: V.splitList(get('syn')),
      ant: V.splitList(get('ant')),
      col: V.splitList(get('col')),
      topic: get('topic'),
      note: get('note')
    };

    if (!data.word || !data.meaning) {
      V.toast('单词和中文释义不能为空', 'error');
      return;
    }

    const dup = V.byWord(data.word);
    if (!id && dup) {
      V.toast('词库里已经有「' + data.word + '」了', 'error');
      return;
    }

    if (id) {
      const w = V.findWord(id);
      if (!w) return;
      Object.assign(w, data);
      if (!w.stats.seen) w.srs.due = V.today();
      V.touchWord(w);
    } else {
      V.state.words.push(V.normalizeWord(data));
    }

    V.save(true);
    V.closeModal();
    V.render();
    V.toast(id ? '已保存' : '已添加「' + data.word + '」', 'success');
  };

  V.deleteWord = function (id) {
    const w = V.findWord(id);
    if (!w) return;
    V.confirm({
      title: '删除「' + w.word + '」？',
      desc: '这个单词的学习记录也会一起删除，无法恢复。',
      confirmText: '删除',
      danger: true,
      onConfirm: () => {
        V.removeWord(id);
        V.save(true);
        V.render();
        V.toast('已删除');
      }
    });
  };

  /* ---------------- 备份恢复 / 示例词表 ---------------- */

  V.importBackup = async function (file) {
    try {
      const text = await file.text();
      const data = JSON.parse(text);
      if (!data || !Array.isArray(data.words)) throw new Error('这个文件不是本软件的备份');
      V.confirm({
        title: '从备份恢复？',
        desc: '当前 ' + V.state.words.length + ' 个单词会被备份里的 ' + data.words.length + ' 个替换，统计也会一起恢复。',
        confirmText: '恢复',
        danger: true,
        onConfirm: () => {
          V.replaceState(data);
          V.render();
          V.toast('已恢复备份', 'success');
        }
      });
    } catch (err) {
      V.toast(err && err.message ? err.message : '备份文件读取失败', 'error');
    }
  };

  V.loadMyWords = function () {
    const list = V.MY_WORDS || [];
    if (!list.length) {
      V.toast('没有内置词表', 'error');
      return;
    }
    V.confirm({
      title: '载入内置词表？',
      desc: '把《单词总表》里的 ' + list.length + ' 个词加入词库，同名跳过，已有学习记录不受影响。',
      confirmText: '载入',
      onConfirm: () => {
        const existing = new Set(V.state.words.map(w => w.word.toLowerCase()));
        let added = 0;
        list.forEach(src => {
          const key = String(src.word).toLowerCase();
          if (existing.has(key)) return;
          V.state.words.push(V.normalizeWord(JSON.parse(JSON.stringify(src))));
          existing.add(key);
          added++;
        });
        V.save(true);
        V.render();
        V.toast(added ? '已载入 ' + added + ' 个单词' : '词表里的单词都已经在词库了', 'success');
      }
    });
  };

  V.loadSample = function () {
    const existing = new Set(V.state.words.map(w => w.word.toLowerCase()));
    let added = 0;
    (V.SAMPLE_WORDS || []).forEach(sw => {
      if (existing.has(sw.word.toLowerCase())) return;
      V.state.words.push(V.normalizeWord(JSON.parse(JSON.stringify(sw))));
      added++;
    });
    V.save(true);
    V.render();
    V.toast(added ? '已加入 ' + added + ' 个示例单词' : '示例词已经在词库里了', 'success');
  };
})();

</script>
<script>
/* 应用入口：路由、事件绑定、快捷键 */
(function () {
  const V = window.V;

  V.go = function (route) {
    if (V.session && !V.session.finished) return;
    if (V.session) V.endSession(true);
    V.ui.route = route;
    V.ui.page = 1;
    V.render();
    window.scrollTo(0, 0);
  };

  document.addEventListener('click', function (e) {
    // 点遮罩关闭弹层
    const backdrop = e.target.closest('[data-modal-backdrop]');
    if (backdrop && e.target === backdrop) {
      V.closeModal();
      return;
    }

    const el = e.target.closest('[data-action]');
    if (!el) return;
    const action = el.dataset.action;

    switch (action) {
      case 'nav':
        V.go(el.dataset.route);
        break;

      case 'import':
        V.openImport();
        break;

      case 'import-again':
        V.openImport();
        break;

      case 'do-import':
        V.doImport();
        break;

      case 'add-word':
        V.openWordForm();
        break;

      case 'edit-word':
        V.openWordForm(el.dataset.id);
        break;

      case 'save-word':
        V.saveWordForm(el.dataset.id || '');
        break;

      case 'delete-word':
        V.deleteWord(el.dataset.id);
        break;

      case 'speak':
        e.stopPropagation();
        V.speak(el.dataset.word);
        break;

      case 'start': {
        if (V.session && !V.session.finished) return;
        if (V.session) V.endSession(true);
        const mode = el.dataset.mode || 'flip';
        const opts = {};
        if (el.dataset.extra) opts.extraNew = Number(el.dataset.extra) || 0;
        V.startSession(mode, opts);
        break;
      }

      case 'review-wrong': {
        const ids = V.wrongWords().map(w => w.id);
        if (!ids.length) { V.toast('错词本是空的'); return; }
        V.startSession('flip', { ids, source: 'wrong' });
        break;
      }

      case 'remove-wrong': {
        const w = V.findWord(el.dataset.id);
        if (w) {
          w.wrong.count = 0;
          V.touchWord(w);
          V.save();
          V.render();
          V.toast('已移出错词本');
        }
        break;
      }

      case 'clear-wrong':
        V.confirm({
          title: '清空错词本？',
          desc: '只会清空「错词」标记，单词和学习进度都保留。',
          confirmText: '清空',
          onConfirm: () => {
            const now = V.stamp();
            V.state.words.forEach(w => {
              w.wrong.count = 0;
              w.updatedAt = now;
            });
            V.save(true);
            V.render();
            V.toast('错词本已清空');
          }
        });
        break;

      case 'flip':
        V.flip();
        break;

      case 'rate':
        V.rate(Number(el.dataset.q));
        break;

      case 'quiz-answer':
        V.quizAnswer(Number(el.dataset.i));
        break;

      case 'session-continue':
        V.sessionContinue();
        break;

      case 'exit-session':
        V.exitSession();
        break;

      case 'session-note':
        V.editSessionNote();
        break;

      case 'save-session-note': {
        const w = V.findWord(el.dataset.id);
        const ta = document.getElementById('note-input');
        if (w && ta) {
          w.note = ta.value.trim();
          V.touchWord(w);
          V.save();
        }
        V.closeModal();
        V.renderSession();
        V.toast('笔记已保存', 'success');
        break;
      }

      case 'home':
        V.endSession(true);
        V.ui.route = 'today';
        V.render();
        window.scrollTo(0, 0);
        break;

      case 'dismiss-ios-tip':
        try { localStorage.setItem('ielts_ios_tip', '1'); } catch (e) { /* ignore */ }
        {
          const el = document.getElementById('ios-tip');
          if (el) el.remove();
        }
        break;

      case 'close-modal':
      case 'confirm-no':
        V.closeModal();
        break;

      case 'confirm-yes': {
        const cb = V._confirmCb;
        V.closeModal();
        if (cb) cb();
        break;
      }

      case 'load-more':
        V.ui.page += 1;
        V.refreshLibrary();
        break;

      case 'export-csv':
        V.exportCSV();
        V.toast('已导出 CSV，可直接用 Excel 打开', 'success');
        break;

      case 'export-json':
        V.exportJSON();
        V.toast('已导出完整备份', 'success');
        break;

      case 'import-backup': {
        const input = document.getElementById('backup-file');
        if (input) input.click();
        break;
      }

      case 'cloud-start':
        V.cloud.openSetup();
        break;

      case 'cloud-config':
        V.cloud.openConfig();
        break;

      case 'cloud-save-config':
        V.cloud.saveConfig();
        break;

      case 'cloud-copy-sql':
        V.cloud.copySql();
        break;

      case 'cloud-sync':
        V.cloud.manualSync();
        break;

      case 'cloud-copy':
        V.cloud.copyLink();
        break;

      case 'cloud-show-link':
        V.cloud.showLink();
        break;

      case 'cloud-reset':
        V.cloud.resetSpace();
        break;

      case 'cloud-disconnect':
        V.cloud.disconnect();
        break;

      case 'load-sample':
        V.loadSample();
        break;

      case 'load-my-words':
        V.loadMyWords();
        break;

      case 'reset-progress':
        V.confirm({
          title: '重置学习进度？',
          desc: '所有单词会变回「新词」，统计、错词本和笔记之外的记录都会清空，单词本身保留。',
          confirmText: '重置',
          danger: true,
          onConfirm: () => {
            const now = V.stamp();
            V.state.words.forEach(w => {
              w.srs = { ease: 2.5, interval: 0, reps: 0, lapses: 0, due: V.today(), last: null };
              w.stats = { seen: 0, correct: 0, wrong: 0 };
              w.wrong = { count: 0, last: null };
              w.updatedAt = now;
            });
            V.resetStats();
            V.save(true);
            V.render();
            V.toast('学习进度已重置');
          }
        });
        break;

      case 'clear-words':
        V.confirm({
          title: '清空所有单词？',
          desc: '词库、学习记录、统计会被全部删除。建议先导出备份。',
          confirmText: '全部删除',
          danger: true,
          onConfirm: () => {
            V.removeAllWords();
            V.resetStats();
            V.save(true);
            V.render();
            V.toast('词库已清空');
          }
        });
        break;
    }
  });

  /* 搜索 / 筛选：只刷新表格，不打断输入 */
  document.addEventListener('input', function (e) {
    if (e.target.id === 'lib-search') {
      V.ui.search = e.target.value;
      V.ui.page = 1;
      V.refreshLibrary();
    }
  });

  document.addEventListener('change', function (e) {
    const t = e.target;

    if (t.id === 'lib-topic') {
      V.ui.topic = t.value;
      V.ui.page = 1;
      V.refreshLibrary();
      return;
    }
    if (t.id === 'lib-mastery') {
      V.ui.mastery = t.value;
      V.ui.page = 1;
      V.refreshLibrary();
      return;
    }
    if (t.id === 'backup-file') {
      const f = t.files && t.files[0];
      t.value = '';
      if (f) V.importBackup(f);
      return;
    }
    if (t.dataset && t.dataset.setting) {
      const key = t.dataset.setting;
      let val = t.value;

      if (key === 'dailyNew' || key === 'reviewLimit') {
        const min = key === 'dailyNew' ? 1 : 10;
        const max = key === 'dailyNew' ? 500 : 999;
        val = Math.max(min, Math.min(max, parseInt(val, 10) || min));
        t.value = val;
      } else if (key === 'rate') {
        val = Number(val) || 0.95;
      } else if (key === 'autoSpeak') {
        val = val === '1';
      }

      V.state.settings[key] = val;
      V.save();
      return;
    }
  });

  /* 键盘 */
  const isTyping = () => /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement && document.activeElement.tagName);

  document.addEventListener('keydown', function (e) {
    const s = V.session;
    const modalOpen = !!document.querySelector('.modal-backdrop');

    if (e.key === 'Escape') {
      if (modalOpen) { V.closeModal(); return; }
      if (s) { V.exitSession(); return; }
    }

    if (s && !s.finished) {
      if (modalOpen || isTyping()) return;

      if (e.key === ' ' || e.key === 'Enter') {
        e.preventDefault();
        if (s.mode === 'quiz') {
          if (s.quiz && s.quiz.answered) V.sessionContinue();
        } else {
          V.flip();
        }
        return;
      }

      if (s.mode !== 'quiz' && s.phase === 'back' && ['1', '2', '3'].indexOf(e.key) >= 0) {
        e.preventDefault();
        V.rate({ 1: 1, 2: 3, 3: 5 }[e.key]);
        return;
      }

      if (s.mode === 'quiz' && s.quiz && !s.quiz.answered && ['1', '2', '3', '4'].indexOf(e.key) >= 0) {
        e.preventDefault();
        V.quizAnswer(Number(e.key) - 1);
        return;
      }
      return;
    }

    if (!s && !modalOpen && !isTyping() && e.key === '/') {
      const input = document.getElementById('lib-search');
      if (input) { e.preventDefault(); input.focus(); }
    }
  });

  /* 离开页面前确保保存 */
  window.addEventListener('beforeunload', () => V.save(true));
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') V.save(true);
  });

  function registerServiceWorker() {
    if (window.__NO_SW__) return;
    if (!('serviceWorker' in navigator)) return;
    // file:// 下浏览器不允许注册 Service Worker，只有 http(s) 才行
    if (location.protocol !== 'http:' && location.protocol !== 'https:') return;
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./sw.js').catch(function () { /* 忽略 */ });
    });
  }

  function init() {
    V.init();
    V.render();
    if (V.cloud) V.cloud.init();

    if (V.storageBroken) {
      setTimeout(() => V.toast('当前打开方式无法保存数据（无痕模式或本地文件），进度不会保留', 'error'), 700);
    } else if (V.justMigrated) {
      V.justMigrated = false;
      setTimeout(() => V.toast('已载入你的 ' + V.state.words.length + ' 个单词', 'success'), 500);
    } else {
      let seen = null;
      try { seen = localStorage.getItem('ielts_vocab_seen'); } catch (e) { seen = '1'; }
      if (V.state.words.length && !seen) {
        // 首次进入给一点引导
        try { localStorage.setItem('ielts_vocab_seen', '1'); } catch (e) { /* ignore */ }
        setTimeout(() => V.toast('按「开始学习」试试，空格翻转，1/2/3 评价', 'info'), 600);
      }
    }

    registerServiceWorker();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();

</script>
